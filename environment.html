<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="店内洗护环境与安心服务流程">
  <title>洗护环境 · 萌宠洗护</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="sub-top"><a href="index.html" class="back-link page-link">返回首页</a></div>
    <main>
      <section class="section reveal"><h2 class="section-title">洗护环境</h2>
        <div class="carousel env-carousel" data-carousel data-autoplay="5000">
          <div class="carousel-viewport"><div class="carousel-track">
              <div class="carousel-slide"><div class="media-frame media-frame--wide"><img src="assets/grooming-room.jpg" alt="洗护区" class="media-img"></div><p class="carousel-caption">洗护区</p></div>
              <div class="carousel-slide"><div class="media-frame media-frame--wide"><img src="assets/beauty-area.jpg" alt="美容区" class="media-img"></div><p class="carousel-caption">美容区</p></div>
              <div class="carousel-slide"><div class="media-frame media-frame--wide"><img src="assets/waiting-area.jpg" alt="等候区" class="media-img"></div><p class="carousel-caption">等候区</p></div>
              <div class="carousel-slide"><div class="media-frame media-frame--wide"><img src="assets/hero-poster.jpg" alt="猫咪护理区" class="media-img"></div><p class="carousel-caption">猫咪护理区</p></div>
          </div></div>
          <div class="carousel-nav">
            <button type="button" class="carousel-btn carousel-btn--prev" aria-label="上一张">‹</button>
            <div class="carousel-dots"></div>
            <button type="button" class="carousel-btn carousel-btn--next" aria-label="下一张">›</button>
          </div>
        </div>
      </section>
      <section class="section reveal">
        <div class="env-tags-row">
          <div class="card env-tag-card">洗护区</div>
          <div class="card env-tag-card">美容区</div>
          <div class="card env-tag-card">等候区</div>
          <div class="card env-tag-card">猫咪护理区</div>
        </div>
      </section>
      <section class="section reveal"><h2 class="section-title">安心流程</h2>
        <div class="process-list">
          <div class="process-step"><span class="process-num">01</span><div class="process-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h10M4 18h6"/></svg></div><div class="process-text"><h3>预约沟通</h3><p>了解宠物情况，贴心安排时段</p></div></div>
          <div class="process-step"><span class="process-num">02</span><div class="process-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/></svg></div><div class="process-text"><h3>到店检查</h3><p>确认体型、毛量与护理需求</p></div></div>
          <div class="process-step"><span class="process-num">03</span><div class="process-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v4M8 7l-2 2M16 7l2 2M6 13h12"/></svg></div><div class="process-text"><h3>温柔洗护</h3><p>专业洗护，细致呵护每一只</p></div></div>
          <div class="process-step"><span class="process-num">04</span><div class="process-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 13l4 4L19 7"/></svg></div><div class="process-text"><h3>完成接宠</h3><p>洗护完成后通知您接回</p></div></div>
        </div>
      </section>
      <section class="section reveal"><h2 class="section-title">环境实景</h2>
        <div class="h-scroll"><div class="h-scroll-inner">
          <div class="h-scroll-item"><img src="assets/grooming-room.jpg" alt="洗护区" class="media-img" loading="lazy"></div>
          <div class="h-scroll-item"><img src="assets/beauty-area.jpg" alt="美容区" class="media-img" loading="lazy"></div>
          <div class="h-scroll-item"><img src="assets/waiting-area.jpg" alt="等候区" class="media-img" loading="lazy"></div>
          <div class="h-scroll-item"><img src="assets/hero-poster.jpg" alt="猫咪护理区" class="media-img" loading="lazy"></div>
        </div></div>
      </section>
      <section class="section page-cta reveal"><a href="booking.html" class="btn btn-primary page-link">立即预约</a></section>
    </main>
    <footer class="footer"><p>用心呵护每一只毛孩子</p></footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
