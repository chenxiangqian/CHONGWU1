<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="在线预约宠物洗护服务">
  <title>在线预约 · 萌宠洗护</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="sub-top"><a href="index.html" class="back-link page-link">返回首页</a></div>
    <main>
      <section class="section reveal"><h2 class="section-title">快速预约</h2>
        <form class="booking-form" id="bookingForm" novalidate>
          <div class="form-group">
            <label for="petType">宠物类型</label>
            <select id="petType" name="petType" required>
              <option value="">请选择</option>
              <option value="dog">狗狗</option>
              <option value="cat">猫咪</option>
            </select>
          </div>
          <div class="form-group">
            <label for="serviceType">服务项目</label>
            <select id="serviceType" name="serviceType" required>
              <option value="">请选择</option>
              <option value="daily">日常洗护</option>
              <option value="style">造型美容</option>
              <option value="cat">猫咪专护</option>
              <option value="care">单项护理</option>
            </select>
          </div>
          <div class="form-group">
            <label for="bookingDate">预约日期</label>
            <input type="date" id="bookingDate" name="bookingDate" required>
          </div>
          <div class="form-group">
            <label for="phone">联系电话</label>
            <input type="tel" id="phone" name="phone" inputmode="numeric" placeholder="11位手机号" required>
          </div>
          <div class="form-group">
            <label for="remark">备注</label>
            <textarea id="remark" name="remark" rows="3" placeholder="可填写宠物品种、特殊需求等"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">提交预约</button>
        </form>
      </section>
    </main>
    <footer class="footer"><p>用心呵护每一只毛孩子</p></footer>
  </div>
  <script src="script.js"></script>

  <div class="modal" id="successModal" role="dialog" aria-modal="true" hidden>
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content card">
      <p class="modal-title">预约已提交</p>
      <p class="modal-text">已收到预约信息，我们会尽快与您确认</p>
      <button type="button" class="btn btn-primary btn-block" id="modalClose">好的</button>
    </div>
  </div>
</body>
</html>
